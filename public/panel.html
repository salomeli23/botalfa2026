<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Panel · Bot WhatsApp</title>
<style>
  :root { --bg:#f2f4f6; --panel:#fff; --line:#e2e5e9; --text:#1c2126; --muted:#6b7480;
    --cli:#fff; --bot:#e7edff; --botc:#3b5bdb; --tel:#dcf7e3; --telc:#14804a; --man:#fff4d6; --manc:#a86a00;
    --alert:#d9480f; --accent:#25d366; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101317; --panel:#191d22; --line:#2a3038; --text:#e6e8eb; --muted:#9aa3ad;
    --cli:#20252c; --bot:#222c4f; --botc:#91a7ff; --tel:#1c3828; --telc:#5fd497; --man:#3b3016; --manc:#f0b44c; --alert:#ff8a50; } }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line) }
  header h1 { font-size:16px; margin:0 } header .sp { flex:1 }
  .live { font-size:12px; color:var(--muted) } .live.on::before { content:"● "; color:var(--accent) }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:6px 12px; border-radius:8px; cursor:pointer }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  button:disabled { opacity:.5; cursor:default }
  main { flex:1; display:grid; grid-template-columns:330px 1fr; min-height:0 }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0 }
  .filtros { padding:10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line) }
  input[type=search], input[type=password] { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit }
  .filtros label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center }
  #lista { overflow-y:auto; flex:1 }
  .c { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer }
  .c:hover, .c.act { background:var(--bg) }
  .c .n { font-weight:600; display:flex; gap:6px; align-items:center }
  .c .n small { margin-left:auto; font-weight:400; color:var(--muted); white-space:nowrap }
  .c .u { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--alert); color:#fff; font-weight:600 }
  .badge.humano { background:var(--botc) }
  button.detener { border-color:var(--alert); color:var(--alert); font-weight:600 }
  button.reactivar { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  #aviso.humano { background:var(--bot); color:var(--botc) }
  section { display:flex; flex-direction:column; min-height:0 }
  #cab { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; min-height:52px }
  #cab .t { font-weight:600 } #cab small { color:var(--muted) }
  #cab .sp { flex:1 }
  #aviso { padding:8px 16px; background:var(--man); color:var(--manc); font-size:13px; border-bottom:1px solid var(--line) }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px }
  .m { max-width:72%; padding:6px 10px 4px; border-radius:10px; border:1px solid var(--line); background:var(--cli); word-wrap:break-word }
  .m .tx { white-space:pre-wrap }
  .m.out { align-self:flex-end }
  .m.bot { background:var(--bot) } .m.telefono { background:var(--tel) } .m.panel, .m.claude { background:var(--man) }
  .m .meta { font-size:11px; color:var(--muted); display:flex; gap:8px; justify-content:flex-end; margin-top:2px }
  .o { font-weight:600 } .o.bot { color:var(--botc) } .o.telefono { color:var(--telc) } .o.panel, .o.claude { color:var(--manc) }
  .err { color:var(--alert); font-weight:600 }
  form#env { display:flex; gap:8px; padding:10px 16px; background:var(--panel); border-top:1px solid var(--line) }
  form#env textarea { flex:1; resize:none; height:42px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit }
  /* Etiquetas tipo CRM: el color sale del nombre (--h = tono) */
  .tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:1px 8px; border-radius:999px;
    background:hsl(var(--h) 70% 90%); color:hsl(var(--h) 55% 28%); white-space:nowrap; border:1px solid transparent }
  @media (prefers-color-scheme: dark) { .tag { background:hsl(var(--h) 35% 24%); color:hsl(var(--h) 70% 82%) } }
  .tag button { all:unset; cursor:pointer; opacity:.6; font-size:13px; line-height:1 } .tag button:hover { opacity:1 }
  .c .tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px }
  #filtroEtq { display:flex; gap:6px; flex-wrap:wrap }
  #filtroEtq .tag { cursor:pointer; opacity:.55 } #filtroEtq .tag.on { opacity:1; border-color:currentColor }
  #filtroEtq .tag.todas { --h:220 }
  #etqBar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line) }
  #etqBar input { border:1px dashed var(--line); background:transparent; color:var(--text); border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; width:150px }
  /* Asesores: quién está conectado y quién ve cada chat */
  #yo { font-size:13px; color:var(--muted) } #yo b { color:var(--text) }
  #enLinea { font-size:12px; color:var(--muted) } #enLinea::before { content:"● "; color:var(--accent) }
  #viendo { padding:6px 16px; font-size:13px; font-weight:600; background:var(--man); color:var(--manc); border-bottom:1px solid var(--line) }
  .c .ojo { font-size:11px; color:var(--manc); font-weight:600; margin-top:3px }
  [hidden] { display:none !important }
  .vacio { margin:auto; color:var(--muted); text-align:center; padding:20px }
  #login { margin:auto; background:var(--panel); padding:28px; border-radius:14px; border:1px solid var(--line); display:flex; flex-direction:column; gap:12px; width:320px }
  .leyenda { display:flex; gap:10px; font-size:12px; flex-wrap:wrap }
  #volver { display:none }
  @media (max-width: 760px) { #volver { display:inline-block } main { grid-template-columns:1fr } aside.oculto { display:none } section.oculto { display:none } }
</style>
</head>
<body>
<form id="login" hidden>
  <h2 style="margin:0">Panel del bot</h2>
  <input type="text" id="asesorNombre" placeholder="Tu nombre (ej. Camilo)" maxlength="30" autocomplete="name"
    style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit" />
  <select id="asesorSel" hidden
    style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit">
  </select>
  <input type="password" id="clave" placeholder="ADMIN_KEY" autocomplete="current-password" required />
  <button class="primary">Entrar</button>
  <div id="loginErr" class="err"></div>
</form>

<header id="top" hidden>
  <h1 id="titulo">Panel del bot</h1>
  <span id="live" class="live">conectando…</span>
  <span id="enLinea" hidden></span>
  <span class="sp"></span>
  <span id="yo"></span>
  <span class="leyenda"><span class="o">👤 cliente</span><span class="o bot">🤖 bot</span><span class="o telefono">📱 teléfono</span><span class="o panel">💻 panel</span></span>
  <button id="salir">Salir</button>
</header>

<main id="app" hidden>
  <aside id="izq">
    <div class="filtros">
      <input type="search" id="buscar" placeholder="Buscar por nombre o número…" />
      <label><input type="checkbox" id="pend" /> Solo los que pidieron asesor</label>
      <label><input type="checkbox" id="humano" /> Solo en modo humano (bot detenido)</label>
      <div id="filtroEtq"></div>
    </div>
    <div id="lista"></div>
  </aside>
  <section id="der" class="oculto">
    <div id="cab"><span class="vacio" style="padding:0">Selecciona una conversación</span></div>
    <div id="viendo" hidden></div>
    <div id="etqBar" hidden>
      <span id="etqChips"></span>
      <input id="etqNueva" list="etqLista" placeholder="+ Agregar etiqueta" maxlength="30" />
      <datalist id="etqLista"></datalist>
    </div>
    <div id="aviso" hidden></div>
    <div id="msgs"></div>
    <form id="env" hidden>
      <textarea id="texto" placeholder="Responder como asesor (llega desde el número del negocio)…"></textarea>
      <button class="primary" id="btnEnv">Enviar</button>
    </form>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const hora = (ts) => new Date(ts * 1000).toLocaleString([], { dateStyle: "short", timeStyle: "short" });
const ORIGEN = { cliente: "👤", bot: "🤖 bot", telefono: "📱 teléfono", panel: "💻 panel", claude: "✨ Claude" };
const ESTADO = { sent: "✓", delivered: "✓✓", read: "✓✓ leído", failed: "⚠️ falló" };

const leer = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const guardar = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
let KEY = leer("panelKey");
let ASESOR = leer("panelAsesor");
// Identifica esta pestaña para la presencia (cada pestaña abierta cuenta por separado)
const PESTANA = (crypto.randomUUID?.() || String(Math.random()).slice(2)) ;
let presencia = [];
let actual = null, contactos = [], es = null, recargaLista = null;
let etiquetaFiltro = "", etiquetasActual = [], todasEtiquetas = [];
const SUGERIDAS = ["Nuevo", "Cotizado", "Agendado", "Cliente", "Seguimiento", "No interesado", "Polarizado", "PPF", "Detailing"];

// Color estable por etiqueta: el mismo nombre siempre da el mismo tono
const tono = (s) => { let h = 0; for (const ch of String(s).toLowerCase()) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };
const chip = (e, extra = "") => `<span class="tag" style="--h:${tono(e)}" ${extra}>${esc(e)}</span>`;

async function api(ruta, opts = {}) {
  const r = await fetch(ruta, { ...opts, headers: { "Content-Type": "application/json", "x-admin-key": KEY,
    "x-asesor": encodeURIComponent(ASESOR), ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { salir(); throw new Error("Clave incorrecta"); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function salir() { guardar("panelKey", ""); KEY = ""; es?.close(); mostrarLogin(); }
let LISTA_ASESORES = [];
async function mostrarLogin() {
  $("#login").hidden = false; $("#top").hidden = $("#app").hidden = true;
  try { LISTA_ASESORES = await fetch("/panel/api/asesores").then((r) => r.json()); } catch { LISTA_ASESORES = []; }
  const fija = LISTA_ASESORES.length > 0;
  $("#asesorNombre").hidden = fija;
  $("#asesorSel").hidden = !fija;
  if (fija) {
    $("#asesorSel").innerHTML = `<option value="">¿Quién eres?</option>` +
      LISTA_ASESORES.map((a) => `<option ${a === ASESOR ? "selected" : ""}>${esc(a)}</option>`).join("");
  } else {
    $("#asesorNombre").value = ASESOR;
  }
  $("#clave").value = KEY;
  (ASESOR ? $("#clave") : fija ? $("#asesorSel") : $("#asesorNombre")).focus();
}

$("#login").addEventListener("submit", async (e) => {
  e.preventDefault();
  ASESOR = (LISTA_ASESORES.length ? $("#asesorSel").value : $("#asesorNombre").value).replace(/\s+/g, " ").trim().slice(0, 30);
  KEY = $("#clave").value.trim();
  if (!ASESOR) { $("#loginErr").textContent = LISTA_ASESORES.length ? "Elige tu nombre" : "Escribe tu nombre"; return; }
  try { await iniciar(); guardar("panelKey", KEY); guardar("panelAsesor", ASESOR); }
  catch (err) { $("#loginErr").textContent = err.message; }
});
$("#salir").addEventListener("click", salir);

async function iniciar() {
  const info = await api("/panel/api/info");
  document.title = `Panel · ${info.negocio}`;
  $("#titulo").textContent = info.negocio;
  $("#yo").innerHTML = `Asesor: <b>${esc(ASESOR)}</b>`;
  $("#login").hidden = true; $("#top").hidden = $("#app").hidden = false;
  await Promise.all([cargarEtiquetas(), cargarLista()]);
  conectarEventos();
}

const nombre = (c) => c?.nombre || "+" + (c?.wa_id || "");

async function cargarEtiquetas() {
  todasEtiquetas = await api("/panel/api/etiquetas");
  if (etiquetaFiltro && !todasEtiquetas.some((t) => t.nombre === etiquetaFiltro)) etiquetaFiltro = "";
  $("#filtroEtq").innerHTML = todasEtiquetas.length
    ? `<span class="tag todas ${etiquetaFiltro ? "" : "on"}" data-etq="">Todas</span>` +
      todasEtiquetas.map((t) => `<span class="tag ${t.nombre === etiquetaFiltro ? "on" : ""}" style="--h:${tono(t.nombre)}"
        data-etq="${esc(t.nombre)}">${esc(t.nombre)} · ${t.clientes}</span>`).join("")
    : "";
  const usadas = new Set(todasEtiquetas.map((t) => t.nombre.toLowerCase()));
  const opciones = [...todasEtiquetas.map((t) => t.nombre), ...SUGERIDAS.filter((s) => !usadas.has(s.toLowerCase()))];
  $("#etqLista").innerHTML = opciones.map((o) => `<option value="${esc(o)}">`).join("");
}

async function cargarLista() {
  const p = new URLSearchParams({ buscar: $("#buscar").value.trim(), pendientes: $("#pend").checked ? "1" : "",
    humano: $("#humano").checked ? "1" : "", etiqueta: etiquetaFiltro });
  contactos = await api("/panel/api/contactos?" + p);
  $("#lista").innerHTML = contactos.map((c) => `
    <div class="c ${c.wa_id === actual ? "act" : ""}" data-id="${esc(c.wa_id)}">
      <div class="n">${esc(nombre(c))} ${c.pendiente_asesor ? '<span class="badge">asesor</span>' : ""}${c.bot_pausado ? '<span class="badge humano" title="Bot detenido">👤 humano</span>' : ""}<small>${c.ultimo_ts ? hora(c.ultimo_ts) : ""}</small></div>
      <div class="u">${esc(c.ultimo_texto)}</div>
      ${c.etiquetas?.length ? `<div class="tags">${c.etiquetas.map((e) => chip(e)).join("")}</div>` : ""}
      <div class="ojo" data-ojo="${esc(c.wa_id)}">${textoOjo(c.wa_id)}</div>
    </div>`).join("") || `<div class="vacio">${etiquetaFiltro ? `Ningún cliente con la etiqueta "${esc(etiquetaFiltro)}".` : "Aún no hay conversaciones.<br>Aparecerán cuando alguien le escriba al bot."}</div>`;
}

// ---- Presencia de asesores ----
// Otros asesores (distintos a mí) que tienen abierto el chat de un cliente
const otrosViendo = (wa_id) =>
  [...new Set(presencia.filter((p) => p.viendo === wa_id && p.asesor !== ASESOR).map((p) => p.asesor))];
const textoOjo = (wa_id) => { const n = otrosViendo(wa_id); return n.length ? `👀 ${esc(n.join(", "))}` : ""; };
const unir = (n) => n.length > 1 ? `${n.slice(0, -1).join(", ")} y ${n.at(-1)}` : n[0];

function pintarPresencia() {
  const enLinea = [...new Set(presencia.map((p) => p.asesor))].filter((n) => n !== ASESOR);
  $("#enLinea").hidden = !enLinea.length;
  $("#enLinea").textContent = enLinea.length ? `También conectado: ${enLinea.join(", ")}` : "";
  document.querySelectorAll("[data-ojo]").forEach((el) => { el.innerHTML = textoOjo(el.dataset.ojo); });
  const n = actual ? otrosViendo(actual) : [];
  $("#viendo").hidden = !n.length;
  $("#viendo").textContent = n.length ? `👀 ${unir(n)} ${n.length > 1 ? "están" : "está"} viendo este chat: coordínense antes de responder.` : "";
}

const avisarViendo = () =>
  api("/panel/api/presencia", { method: "POST", body: JSON.stringify({ pestana: PESTANA, viendo: actual }) }).catch(() => {});

function pintarEtiquetasActual() {
  $("#etqChips").innerHTML = etiquetasActual.map((e) =>
    chip(e).replace("</span>", `<button title="Quitar" data-quitar="${esc(e)}">×</button></span>`)).join(" ");
}

async function guardarEtiquetas(lista) {
  const anterior = etiquetasActual;
  etiquetasActual = lista;
  pintarEtiquetasActual();
  try {
    const c = await api("/panel/api/etiquetas", { method: "POST", body: JSON.stringify({ wa_id: actual, etiquetas: lista }) });
    etiquetasActual = c.etiquetas || [];
    pintarEtiquetasActual();
    cargarEtiquetas(); programarLista();
  } catch (err) { etiquetasActual = anterior; pintarEtiquetasActual(); alert(err.message); }
}
const programarLista = () => { clearTimeout(recargaLista); recargaLista = setTimeout(cargarLista, 300); };

async function abrir(wa_id) {
  actual = wa_id;
  $("#izq").classList.add("oculto"); $("#der").classList.remove("oculto");
  document.querySelectorAll(".c").forEach((el) => el.classList.toggle("act", el.dataset.id === wa_id));
  avisarViendo();
  pintarPresencia();
  await cargarConversacion();
}

async function cargarConversacion() {
  if (!actual) return;
  const { contacto: c, mensajes } = await api("/panel/api/mensajes?wa_id=" + encodeURIComponent(actual));
  $("#cab").innerHTML = `
    <button id="volver" title="Volver" style="padding:4px 10px">←</button>
    <div><div class="t">${esc(nombre(c || { wa_id: actual }))}</div><small>+${esc(actual)}</small></div>
    <span class="sp"></span>
    ${c?.bot_pausado
      ? '<button id="botToggle" class="reactivar" title="El bot vuelve a responder automáticamente">▶ Reactivar bot</button>'
      : '<button id="botToggle" class="detener" title="El bot deja de responder a este cliente; lo atiendes tú">⏸ Detener bot</button>'}
    ${c?.pendiente_asesor ? '<button id="atendido">✅ Marcar atendido</button>' : '<button id="marcar">🙋 Marcar pendiente</button>'}`;
  etiquetasActual = c?.etiquetas || [];
  $("#etqBar").hidden = false;
  pintarEtiquetasActual();
  const aviso = [];
  if (c?.bot_pausado) aviso.push("👤 Modo humano: el bot está detenido para este cliente. Sus mensajes llegan aquí y a tu celular, y respondes tú.");
  $("#aviso").classList.toggle("humano", !!c?.bot_pausado && !c?.pendiente_asesor && !!c?.ventana_abierta);
  if (c?.pendiente_asesor) aviso.push(`🙋 Pidió asesor: ${c.motivo_asesor || ""}`);
  if (!c?.ventana_abierta) aviso.push("⏰ Pasaron más de 24 h desde su último mensaje: Meta solo permite escribirle con una plantilla aprobada.");
  $("#aviso").hidden = !aviso.length;
  $("#aviso").innerHTML = aviso.map(esc).join("<br>");
  $("#env").hidden = !c?.ventana_abierta;
  $("#msgs").innerHTML = mensajes.map((m) => `
    <div class="m ${m.direccion === "saliente" ? "out" : ""} ${m.origen}"><div class="tx">${esc(m.texto)}</div><div class="meta">${m.origen !== "cliente" ? `<span class="o ${m.origen}">${m.origen === "panel" && m.asesor ? `💻 ${esc(m.asesor)}` : ORIGEN[m.origen] || m.origen}</span>` : ""}
      <span>${hora(m.ts)}</span>${m.estado ? `<span class="${m.estado === "failed" ? "err" : ""}">${ESTADO[m.estado] || m.estado}</span>` : ""}</div>
    </div>`).join("") || '<div class="vacio">Sin mensajes</div>';
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}

$("#lista").addEventListener("click", (e) => { const el = e.target.closest(".c"); if (el) abrir(el.dataset.id); });
$("#cab").addEventListener("click", async (e) => {
  if (e.target.id === "volver") { actual = null; avisarViendo(); pintarPresencia(); $("#izq").classList.remove("oculto"); $("#der").classList.add("oculto"); }
  if (e.target.id === "botToggle") {
    const detener = e.target.classList.contains("detener");
    e.target.disabled = true;
    try { await api("/panel/api/bot", { method: "POST", body: JSON.stringify({ wa_id: actual, pausado: detener }) }); }
    catch (err) { alert(err.message); }
    cargarConversacion(); cargarLista();
  }
  if (e.target.id === "atendido" || e.target.id === "marcar") {
    await api("/panel/api/atendido", { method: "POST", body: JSON.stringify({ wa_id: actual, pendiente: e.target.id === "marcar" }) });
    cargarConversacion(); cargarLista();
  }
});
$("#filtroEtq").addEventListener("click", (e) => {
  const el = e.target.closest("[data-etq]");
  if (!el) return;
  etiquetaFiltro = el.dataset.etq === etiquetaFiltro ? "" : el.dataset.etq;
  cargarEtiquetas(); cargarLista();
});
$("#etqChips").addEventListener("click", (e) => {
  const q = e.target.closest("[data-quitar]")?.dataset.quitar;
  if (q != null) guardarEtiquetas(etiquetasActual.filter((x) => x !== q));
});
function agregarEtiqueta() {
  const v = $("#etqNueva").value.replace(/\s+/g, " ").trim();
  $("#etqNueva").value = "";
  if (!v || !actual || etiquetasActual.some((x) => x.toLowerCase() === v.toLowerCase())) return;
  // Si ya existe con otras mayúsculas, se usa la forma existente para no duplicar
  const existente = todasEtiquetas.find((t) => t.nombre.toLowerCase() === v.toLowerCase())?.nombre;
  guardarEtiquetas([...etiquetasActual, existente || v]);
}
$("#etqNueva").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); agregarEtiqueta(); } });
// Elegir una opción de la lista también la agrega
$("#etqNueva").addEventListener("change", () => { if ($("#etqNueva").value.trim()) agregarEtiqueta(); });
$("#buscar").addEventListener("input", programarLista);
$("#pend").addEventListener("change", cargarLista);
$("#humano").addEventListener("change", cargarLista);
$("#texto").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#env").requestSubmit(); } });
$("#env").addEventListener("submit", async (e) => {
  e.preventDefault();
  const texto = $("#texto").value.trim();
  if (!texto || !actual) return;
  $("#btnEnv").disabled = true;
  try { await api("/panel/api/enviar", { method: "POST", body: JSON.stringify({ to: actual, texto }) }); $("#texto").value = ""; }
  catch (err) { alert(err.message); }
  finally { $("#btnEnv").disabled = false; }
});

function conectarEventos() {
  es?.close();
  const p = new URLSearchParams({ key: KEY, asesor: ASESOR, pestana: PESTANA });
  es = new EventSource("/panel/api/eventos?" + p);
  // Al (re)conectar, el servidor no sabe qué chat tengo abierto: se lo recuerdo
  es.onopen = () => { $("#live").textContent = "en vivo"; $("#live").classList.add("on"); if (actual) avisarViendo(); };
  es.addEventListener("presencia", (e) => { presencia = JSON.parse(e.data); pintarPresencia(); });
  es.onerror = () => { $("#live").textContent = "reconectando…"; $("#live").classList.remove("on"); };
  const alCambiar = (e) => { const d = JSON.parse(e.data); programarLista(); if (d.wa_id === actual) cargarConversacion(); };
  es.addEventListener("mensaje", alCambiar);
  es.addEventListener("estado", alCambiar);
  es.addEventListener("contacto", (e) => { alCambiar(e); cargarEtiquetas(); });
}

// Con clave y nombre guardados entra directo; si falta el nombre (sesiones de antes), lo pide una vez
// (si hay lista fija y el nombre guardado ya no está en ella, también lo pide)
(async () => {
  try { LISTA_ASESORES = await fetch("/panel/api/asesores").then((r) => r.json()); } catch {}
  const valido = !LISTA_ASESORES.length || LISTA_ASESORES.includes(ASESOR);
  if (KEY && ASESOR && valido) iniciar().catch(mostrarLogin); else mostrarLogin();
})();
</script>
