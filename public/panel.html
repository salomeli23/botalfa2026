<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Panel · Bot WhatsApp</title>
<style>
  :root { --bg:#f2f4f6; --panel:#fff; --line:#e2e5e9; --text:#1c2126; --muted:#6b7480;
    --cli:#fff; --bot:#e7edff; --botc:#3b5bdb; --tel:#dcf7e3; --telc:#14804a; --man:#fff4d6; --manc:#a86a00;
    --alert:#d9480f; --accent:#25d366; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101317; --panel:#191d22; --line:#2a3038; --text:#e6e8eb; --muted:#9aa3ad;
    --cli:#20252c; --bot:#222c4f; --botc:#91a7ff; --tel:#1c3828; --telc:#5fd497; --man:#3b3016; --manc:#f0b44c; --alert:#ff8a50; } }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line) }
  header h1 { font-size:16px; margin:0 } header .sp { flex:1 }
  .live { font-size:12px; color:var(--muted) } .live.on::before { content:"● "; color:var(--accent) }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:6px 12px; border-radius:8px; cursor:pointer }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600 }
  button:disabled { opacity:.5; cursor:default }
  main { flex:1; display:grid; grid-template-columns:330px 1fr; min-height:0 }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0 }
  .filtros { padding:10px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line) }
  input[type=search], input[type=password] { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit }
  .filtros label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center }
  #lista { overflow-y:auto; flex:1 }
  .c { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer }
  .c:hover, .c.act { background:var(--bg) }
  .c .n { font-weight:600; display:flex; gap:6px; align-items:center }
  .c .n small { margin-left:auto; font-weight:400; color:var(--muted); white-space:nowrap }
  .c .u { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--alert); color:#fff; font-weight:600 }
  section { display:flex; flex-direction:column; min-height:0 }
  #cab { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; min-height:52px }
  #cab .t { font-weight:600 } #cab small { color:var(--muted) }
  #cab .sp { flex:1 }
  #aviso { padding:8px 16px; background:var(--man); color:var(--manc); font-size:13px; border-bottom:1px solid var(--line) }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px }
  .m { max-width:72%; padding:6px 10px 4px; border-radius:10px; border:1px solid var(--line); background:var(--cli); word-wrap:break-word }
  .m .tx { white-space:pre-wrap }
  .m.out { align-self:flex-end }
  .m.bot { background:var(--bot) } .m.telefono { background:var(--tel) } .m.panel, .m.claude { background:var(--man) }
  .m .meta { font-size:11px; color:var(--muted); display:flex; gap:8px; justify-content:flex-end; margin-top:2px }
  .o { font-weight:600 } .o.bot { color:var(--botc) } .o.telefono { color:var(--telc) } .o.panel, .o.claude { color:var(--manc) }
  .err { color:var(--alert); font-weight:600 }
  form#env { display:flex; gap:8px; padding:10px 16px; background:var(--panel); border-top:1px solid var(--line) }
  form#env textarea { flex:1; resize:none; height:42px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit }
  [hidden] { display:none !important }
  .vacio { margin:auto; color:var(--muted); text-align:center; padding:20px }
  #login { margin:auto; background:var(--panel); padding:28px; border-radius:14px; border:1px solid var(--line); display:flex; flex-direction:column; gap:12px; width:320px }
  .leyenda { display:flex; gap:10px; font-size:12px; flex-wrap:wrap }
  #volver { display:none }
  @media (max-width: 760px) { #volver { display:inline-block } main { grid-template-columns:1fr } aside.oculto { display:none } section.oculto { display:none } }
</style>
</head>
<body>
<form id="login" hidden>
  <h2 style="margin:0">Panel del bot</h2>
  <input type="password" id="clave" placeholder="ADMIN_KEY" autocomplete="current-password" required />
  <button class="primary">Entrar</button>
  <div id="loginErr" class="err"></div>
</form>

<header id="top" hidden>
  <h1 id="titulo">Panel del bot</h1>
  <span id="live" class="live">conectando…</span>
  <span class="sp"></span>
  <span class="leyenda"><span class="o">👤 cliente</span><span class="o bot">🤖 bot</span><span class="o telefono">📱 teléfono</span><span class="o panel">💻 panel</span><span class="o claude">✨ Claude</span></span>
  <button id="salir">Salir</button>
</header>

<main id="app" hidden>
  <aside id="izq">
    <div class="filtros">
      <input type="search" id="buscar" placeholder="Buscar por nombre o número…" />
      <label><input type="checkbox" id="pend" /> Solo los que pidieron asesor</label>
    </div>
    <div id="lista"></div>
  </aside>
  <section id="der" class="oculto">
    <div id="cab"><span class="vacio" style="padding:0">Selecciona una conversación</span></div>
    <div id="aviso" hidden></div>
    <div id="msgs"></div>
    <form id="env" hidden>
      <textarea id="texto" placeholder="Responder como asesor (llega desde el número del negocio)…"></textarea>
      <button class="primary" id="btnEnv">Enviar</button>
    </form>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const hora = (ts) => new Date(ts * 1000).toLocaleString([], { dateStyle: "short", timeStyle: "short" });
const ORIGEN = { cliente: "👤", bot: "🤖 bot", telefono: "📱 teléfono", panel: "💻 panel", claude: "✨ Claude" };
const ESTADO = { sent: "✓", delivered: "✓✓", read: "✓✓ leído", failed: "⚠️ falló" };

let KEY = localStorage.getItem("panelKey") || "";
let actual = null, contactos = [], es = null, recargaLista = null;

async function api(ruta, opts = {}) {
  const r = await fetch(ruta, { ...opts, headers: { "Content-Type": "application/json", "x-admin-key": KEY, ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { salir(); throw new Error("Clave incorrecta"); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function salir() { localStorage.removeItem("panelKey"); KEY = ""; es?.close(); mostrarLogin(); }
function mostrarLogin() { $("#login").hidden = false; $("#top").hidden = $("#app").hidden = true; }

$("#login").addEventListener("submit", async (e) => {
  e.preventDefault();
  KEY = $("#clave").value.trim();
  try { await iniciar(); localStorage.setItem("panelKey", KEY); }
  catch (err) { $("#loginErr").textContent = err.message; }
});
$("#salir").addEventListener("click", salir);

async function iniciar() {
  const info = await api("/panel/api/info");
  document.title = `Panel · ${info.negocio}`;
  $("#titulo").textContent = info.negocio;
  $("#login").hidden = true; $("#top").hidden = $("#app").hidden = false;
  await cargarLista();
  conectarEventos();
}

const nombre = (c) => c?.nombre || "+" + (c?.wa_id || "");

async function cargarLista() {
  const p = new URLSearchParams({ buscar: $("#buscar").value.trim(), pendientes: $("#pend").checked ? "1" : "" });
  contactos = await api("/panel/api/contactos?" + p);
  $("#lista").innerHTML = contactos.map((c) => `
    <div class="c ${c.wa_id === actual ? "act" : ""}" data-id="${esc(c.wa_id)}">
      <div class="n">${esc(nombre(c))} ${c.pendiente_asesor ? '<span class="badge">asesor</span>' : ""}<small>${c.ultimo_ts ? hora(c.ultimo_ts) : ""}</small></div>
      <div class="u">${esc(c.ultimo_texto)}</div>
    </div>`).join("") || '<div class="vacio">Aún no hay conversaciones.<br>Aparecerán cuando alguien le escriba al bot.</div>';
}
const programarLista = () => { clearTimeout(recargaLista); recargaLista = setTimeout(cargarLista, 300); };

async function abrir(wa_id) {
  actual = wa_id;
  $("#izq").classList.add("oculto"); $("#der").classList.remove("oculto");
  document.querySelectorAll(".c").forEach((el) => el.classList.toggle("act", el.dataset.id === wa_id));
  await cargarConversacion();
}

async function cargarConversacion() {
  if (!actual) return;
  const { contacto: c, mensajes } = await api("/panel/api/mensajes?wa_id=" + encodeURIComponent(actual));
  $("#cab").innerHTML = `
    <button id="volver" title="Volver" style="padding:4px 10px">←</button>
    <div><div class="t">${esc(nombre(c || { wa_id: actual }))}</div><small>+${esc(actual)}</small></div>
    <span class="sp"></span>
    ${c?.pendiente_asesor ? '<button id="atendido">✅ Marcar atendido</button>' : '<button id="marcar">🙋 Marcar pendiente</button>'}`;
  const aviso = [];
  if (c?.pendiente_asesor) aviso.push(`🙋 Pidió asesor: ${c.motivo_asesor || ""}`);
  if (!c?.ventana_abierta) aviso.push("⏰ Pasaron más de 24 h desde su último mensaje: Meta solo permite escribirle con una plantilla aprobada.");
  $("#aviso").hidden = !aviso.length;
  $("#aviso").innerHTML = aviso.map(esc).join("<br>");
  $("#env").hidden = !c?.ventana_abierta;
  $("#msgs").innerHTML = mensajes.map((m) => `
    <div class="m ${m.direccion === "saliente" ? "out" : ""} ${m.origen}"><div class="tx">${esc(m.texto)}</div><div class="meta">${m.origen !== "cliente" ? `<span class="o ${m.origen}">${ORIGEN[m.origen] || m.origen}</span>` : ""}
      <span>${hora(m.ts)}</span>${m.estado ? `<span class="${m.estado === "failed" ? "err" : ""}">${ESTADO[m.estado] || m.estado}</span>` : ""}</div>
    </div>`).join("") || '<div class="vacio">Sin mensajes</div>';
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
}

$("#lista").addEventListener("click", (e) => { const el = e.target.closest(".c"); if (el) abrir(el.dataset.id); });
$("#cab").addEventListener("click", async (e) => {
  if (e.target.id === "volver") { actual = null; $("#izq").classList.remove("oculto"); $("#der").classList.add("oculto"); }
  if (e.target.id === "atendido" || e.target.id === "marcar") {
    await api("/panel/api/atendido", { method: "POST", body: JSON.stringify({ wa_id: actual, pendiente: e.target.id === "marcar" }) });
    cargarConversacion(); cargarLista();
  }
});
$("#buscar").addEventListener("input", programarLista);
$("#pend").addEventListener("change", cargarLista);
$("#texto").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#env").requestSubmit(); } });
$("#env").addEventListener("submit", async (e) => {
  e.preventDefault();
  const texto = $("#texto").value.trim();
  if (!texto || !actual) return;
  $("#btnEnv").disabled = true;
  try { await api("/panel/api/enviar", { method: "POST", body: JSON.stringify({ to: actual, texto }) }); $("#texto").value = ""; }
  catch (err) { alert(err.message); }
  finally { $("#btnEnv").disabled = false; }
});

function conectarEventos() {
  es?.close();
  es = new EventSource("/panel/api/eventos?key=" + encodeURIComponent(KEY));
  es.onopen = () => { $("#live").textContent = "en vivo"; $("#live").classList.add("on"); };
  es.onerror = () => { $("#live").textContent = "reconectando…"; $("#live").classList.remove("on"); };
  const alCambiar = (e) => { const d = JSON.parse(e.data); programarLista(); if (d.wa_id === actual) cargarConversacion(); };
  es.addEventListener("mensaje", alCambiar);
  es.addEventListener("estado", alCambiar);
  es.addEventListener("contacto", alCambiar);
}

if (KEY) iniciar().catch(mostrarLogin); else mostrarLogin();
</script>
</body>
</html>
